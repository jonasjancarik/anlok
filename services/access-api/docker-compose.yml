services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: sh -c "[ ! -f data.db ] && uv run --locked python setup.py; exec uv run --locked python api.py"
    stdin_open: true
    tty: true

  # db:
  #   image: sqlite:latest
  #   volumes:
  #     - ./data:/data

networks:
  default:
    name: door-access-network
